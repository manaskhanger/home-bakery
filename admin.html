<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b2019">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders · Admin</title>
</head>
<body data-page="admin" class="page-soft">
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">🧁</span><span data-cfg="bakeryName">Your Bakery Name</span> <span class="admin-tag">Admin</span></a>
      <div class="admin-head-actions" data-admin-only hidden>
        <span class="mode-pill" data-mode-pill></span>
        <button class="btn btn-small btn-outline" type="button" data-logout>Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap page-main">
    <!-- Login -->
    <section class="login" data-login>
      <form class="card form-card login-card" id="login-form" novalidate>
        <div class="login-emoji" aria-hidden="true">🔐</div>
        <h1>Orders dashboard</h1>
        <p class="muted">Enter the admin password to manage orders.</p>
        <label class="field"><span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required></label>
        <div class="form-error" data-form-error role="alert" hidden></div>
        <button class="btn btn-choc btn-block" type="submit">Log in</button>
        <p class="demo-hint" data-demo-only hidden>Demo password: <b>bakery123</b></p>
      </form>
    </section>

    <!-- Dashboard -->
    <section class="dashboard" data-dashboard hidden>
      <div class="dash-top">
        <div>
          <p class="kicker">Order book <span class="demo-badge" data-demo-only hidden title="Demo mode: orders are saved in this browser only. No emails are sent.">Demo</span></p>
          <h1>Orders</h1>
        </div>
        <button class="btn btn-small btn-outline" type="button" data-refresh>↻ Refresh</button>
      </div>

      <div class="stats" data-stats></div>

      <div class="tabs" role="tablist" data-tabs>
        <button role="tab" data-filter="" class="active">All</button>
        <button role="tab" data-filter="Pending">Pending</button>
        <button role="tab" data-filter="Confirmed">Confirmed</button>
        <button role="tab" data-filter="Declined">Declined</button>
      </div>

      <div class="orders" data-orders></div>
    </section>
  </main>
  <p class="copyright admin-foot"><span data-store-note>Orders are stored in your Google Sheet</span> · <button type="button" class="linklike" data-reset-demo data-demo-only hidden>Reset demo data</button><span data-demo-only hidden> · </span><a href="index.html">View shop</a></p>

  <div class="toast" data-toast role="status" aria-live="polite"></div>
  <script src="config.js?v=2"></script>
  <script src="rules.js?v=2"></script>
  <script src="demo-backend.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
